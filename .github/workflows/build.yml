name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test (including elevated data-safety suite), publish and build installer
        shell: pwsh
        run: ./Setup/Publish.ps1   # hosted runners are elevated, so the Elevated tests run on real virtual disks

      - name: Build standalone installer (.NET runtime embedded)
        shell: pwsh
        run: ./Setup/Publish.ps1 -SkipTests -SelfContained

      - name: Data-safety suite must run elevated (an all-skipped run fails)
        shell: pwsh
        run: dotnet test Source/VhdAttach-Test/VhdAttach-Test.csproj -c Release -- --filter "TestCategory=Elevated"

      - uses: actions/upload-artifact@v4
        with:
          name: vhdstudio-setup
          path: Releases/*.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/*.exe
          generate_release_notes: true
