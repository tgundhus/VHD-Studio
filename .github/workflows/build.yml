name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      installerOnly:
        description: 'Run installer regressions without repeating the product/data-safety suites'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Use pinned Inno Setup 7.1.0 (same or newer than the previous release)
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup-7.1.0'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') {
            throw 'The pinned Inno Setup download checksum does not match.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Pyrsys B.V.') {
            throw 'The Inno Setup download does not have a valid Pyrsys B.V. signature.'
          }
          $process = Start-Process -FilePath $download -ArgumentList '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', '/TASKS=""', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $compilerDirectory + '"') -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Portable Inno Setup extraction timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $compilerDirectory 'ISCC.exe'))) { throw 'Portable Inno Setup extraction failed.' }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test (including elevated data-safety suite), publish and build installer
        if: ${{ !inputs.installerOnly }}
        shell: pwsh
        run: ./Setup/Publish.ps1   # hosted runners are elevated, so the Elevated tests run on real virtual disks

      - name: Publish regular installer (installer-only manual run)
        if: ${{ inputs.installerOnly }}
        shell: pwsh
        run: ./Setup/Publish.ps1 -SkipTests

      - name: Build standalone installer (.NET runtime embedded)
        shell: pwsh
        run: ./Setup/Publish.ps1 -SkipTests -SelfContained

      - name: Data-safety suite must run elevated (an all-skipped run fails)
        if: ${{ !inputs.installerOnly }}
        shell: pwsh
        run: dotnet test Source/VhdAttach-Test/VhdAttach-Test.csproj -c Release -- --filter "TestCategory=Elevated"

      - name: Download previous release as installer upgrade fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v5.1.0 --repo tgundhus/VHD-Studio --pattern vhdstudio-5.1.0-setup.exe --dir "$env:RUNNER_TEMP/previous-release"

      - name: Test real installer upgrades on this disposable runner
        shell: pwsh
        run: |
          [xml] $props = Get-Content Source/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          ./Setup/Test-Installer.ps1 `
            -PreviousInstaller "$env:RUNNER_TEMP/previous-release/vhdstudio-5.1.0-setup.exe" `
            -RegularInstaller "$pwd/Releases/vhdstudio-$version-setup.exe" `
            -StandaloneInstaller "$pwd/Releases/vhdstudio-$version-setup-standalone.exe"

      - name: Upload installer smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-results
          path: TestResults/Installer/**

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Source/**/TestResults/**

      - uses: actions/upload-artifact@v4
        with:
          name: vhdstudio-setup
          path: Releases/*.exe

